services:
  - type: web
    name: zola-elite-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
