services:
  - type: web
    name: zola-elite
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false   # pon tu key en el panel de Render (Environment)
      - key: PYTHON_VERSION
        value: 3.12.7
